spec_version: "0.1.0"
name: "market-agents-orchestrator"
version: "1.0.0"
description: >
  Unified multi-harness agentic plugin marketplace and transpilation engine, orchestrating 94 plugins,
  202 agents, 184 skills, and 105 commands across Claude Code, OpenAI Codex, Cursor, OpenCode, Antigravity, Copilot, and Pi.
author: "Chithra R"
license: "MIT"

model:
  preferred: "claude-3-5-sonnet"
  fallback:
    - "gpt-4o"
    - "gemini-2.0-flash"
  constraints:
    temperature: 0.1
    max_tokens: 8192

skills:
  - plugin-catalog-curation
  - cross-harness-transpilation
  - skill-namespace-validation
  - marketplace-release-orchestration

tools:
  - plugin-manifest-generator
  - harness-adapter-transpiler
  - skill-collision-validator
  - marketplace-registry-publisher
  - documentation-gardener-audit

runtime:
  max_turns: 25
  temperature: 0.1
  timeout: 180

compliance:
  risk_tier: standard
  frameworks:
    - mitre-atlas
    - owasp-llm
  data_governance:
    pii_handling: redact
    data_classification: confidential
  recordkeeping:
    audit_logging: true
    log_format: structured_json
  supervision:
    human_in_the_loop: conditional
    override_capability: true
    kill_switch: true

tags:
  - developer-tools
  - agent-marketplace
  - plugin-system
  - claude-code
  - cursor
  - codex
  - antigravity
  - multi-agent

metadata:
  domain: "developer-tools"
  category: "Developer Tools"
