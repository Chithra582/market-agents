name: "harness-adapter-transpiler"
description: "Transpiles source Markdown plugin definitions into native configurations for Claude Code, Codex, Cursor, and Antigravity."
input_schema:
  type: "object"
  properties:
    harness:
      type: "string"
      enum: ["claude-code", "codex", "cursor", "opencode", "antigravity", "copilot", "pi", "all"]
      description: "Target agent runtime harness."
    plugin_name:
      type: "string"
      description: "Name of the plugin to transpile, or 'all' for full catalog generation."
    clean_build:
      type: "boolean"
      description: "Whether to purge previous generated output trees before transpilation."
  required:
    - "harness"
    - "plugin_name"
